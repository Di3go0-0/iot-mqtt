version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: postgres-iot
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: iot
      TZ: America/Bogota
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/init.sql:/docker-entrypoint-initdb.d/init.sql

  server:
    build: ./server
    container_name: iot-server
    restart: always
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iot
      DB_USER: admin
      DB_PASSWORD: admin123
    depends_on:
      - postgres

  telegram-bot:
    build: ./telegram_bot
    container_name: telegram-bot
    restart: always
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-8791517471:AAEfwJ5iJpTJfR72SggWSIg20Tfi1x-TBJU}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: iot
      DB_USER: admin
      DB_PASSWORD: admin123
    depends_on:
      - postgres

volumes:
  postgres_data:
